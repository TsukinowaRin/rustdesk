# Grok project permissions are loaded even before folder trust. Keep the hard
# boundary here because Claude-compatible project hooks are trust-gated and
# therefore cannot be the first line of defence for an unfamiliar checkout.
[permission]
deny = [
  "Read(.env)",
  "Read(.env.*)",
  "Read(**/.env)",
  "Read(**/.env.*)",
  "Read(**/*.key)",
  "Read(**/*.p12)",
  "Read(**/*.pem)",
  "Read(**/id_rsa*)",
  "Read(**/aws/credentials)",
  "Read(**/.npmrc)",
  "Read(**/credentials)",
  "Read(**/known_hosts)",
  "Grep(.env)",
  "Grep(.env.*)",
  "Grep(**/.env)",
  "Grep(**/.env.*)",
  "Grep(**/*.key)",
  "Grep(**/*.p12)",
  "Grep(**/*.pem)",
  "Grep(**/id_rsa*)",
  "Grep(**/aws/credentials)",
  "Grep(**/.npmrc)",
  "Grep(**/credentials)",
  "Grep(**/known_hosts)",
  "Edit(.env)",
  "Edit(.env.*)",
  "Edit(**/.env)",
  "Edit(**/.env.*)",
  "Edit(**/*.key)",
  "Edit(**/*.p12)",
  "Edit(**/*.pem)",
  "Edit(**/id_rsa*)",
  "Edit(**/aws/credentials)",
  "Edit(**/.npmrc)",
  "Edit(**/credentials)",
  "Edit(**/known_hosts)",
  "Bash(*git reset --hard*)",
  "Bash(*git clean -fd*)",
  "Bash(*rm -rf /*)",
  "Bash(rm -rf *)",
  "Bash(*sudo rm -rf*)",
  "Bash(*mkfs*)",
  "Bash(*dd if=*)",
  "Bash(*.env*)",
  "Bash(*.npmrc*)",
  "Bash(*id_rsa*)",
  "Bash(*aws/credentials*)",
  "Bash(*.pem*)",
  "Bash(*.p12*)",
  "Bash(*.key*)",
]
ask = [
  "Agent",
  "Bash(sudo *)",
  "Bash(doas *)",
  "Bash(pkexec *)",
  "Bash(runas *)",
  "Bash(*Start-Process*RunAs*)",
  "Bash(git push*)",
  "Bash(curl *)",
  "Bash(wget *)",
  "Bash(git clone*)",
  "Bash(gh repo clone*)",
]
